# Runs the K2X live relayer during Korean market hours (08:00–20:00 KST, Mon–Fri).
# GitHub-hosted jobs last at most 6 hours, so the day is covered by three scheduled runs.
# Needs repository secret OPERATOR_PRIVATE_KEY (Monad testnet operator).
name: live-relayer

on:
  schedule:
    - cron: "55 22 * * 0-4" # 07:55 KST Mon–Fri
    - cron: "50 4 * * 1-5" # 13:50 KST
    - cron: "45 10 * * 1-5" # 19:45 KST
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to run (max 355)"
        default: "355"

concurrency:
  group: live-relayer
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Relay
        env:
          OPERATOR_PRIVATE_KEY: ${{ secrets.OPERATOR_PRIVATE_KEY }}
        run: |
          MIN="${{ github.event.inputs.minutes }}"
          if [ -z "$MIN" ]; then
            case "$(date -u +%H)" in
              22|23) MIN=355 ;;   # morning run until ~13:50 KST
              04|05) MIN=355 ;;   # afternoon run until ~19:45 KST
              *) MIN=25 ;;        # evening run until 20:10 KST
            esac
          fi
          npm run live -w @k2x/relayer -- testnet --minutes "$MIN"
